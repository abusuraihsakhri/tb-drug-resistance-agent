name: Python tests and package checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[api,test]"
          python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents tb_drug_resistance_agent tb_resistance.py enrichment.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          python -m tb_resistance classify --susceptibility '{"rifampicin":"R","isoniazid":"S","moxifloxacin":"R"}'
          python -m tb_drug_resistance_agent.cli verify-audit
