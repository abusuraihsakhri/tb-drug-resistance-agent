[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tb-drug-resistance-engine"
version = "2.0.0"
description = "Research-only tuberculosis DST resistance classification and demonstrations"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
tb-drug-resistance-engine = "tb_drug_resistance_agent.cli:main"
tb-resistance = "tb_resistance:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/tb-drug-resistance-agent"
Repository = "https://github.com/abusuraihsakhri/tb-drug-resistance-agent.git"

[tool.setuptools]
py-modules = ["tb_resistance", "enrichment", "simulator", "cli", "tb_resistance_app", "tb_drug_resistance_agent_app"]

[tool.setuptools.packages.find]
include = ["agents*", "tb_drug_resistance_agent*"]
